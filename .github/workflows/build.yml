name: Build Signed Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Download Gradle Wrapper Jar
      run: |
        mkdir -p gradle/wrapper
        curl -fL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Generate Release Keystore
      run: |
        echo "🔐 Generating signing keystore..."
        keytool -genkey -v -keystore release-key.jks \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias release-key \
          -storepass android123 \
          -keypass android123 \
          -dname "CN=Shorts Video Generator, OU=Dev, O=Dev, L=City, ST=State, C=US"
        echo "✅ Keystore generated successfully"

    - name: Download 200 Videos + Font into APK Assets
      run: |
        echo "📁 Creating assets directory..."
        mkdir -p app/src/main/assets
        
        echo "📥 Downloading font.ttf..."
        curl -fL --retry 3 -o app/src/main/assets/font.ttf "https://github.com/vishala5000/shorts-Video-Generator/releases/download/videos/font.ttf"
        
        echo "📥 Downloading 200 video clips in parallel (20 at a time)..."
        seq 1 200 | xargs -P 20 -I {} curl -fL --retry 3 -o "app/src/main/assets/{}.mp4" "https://github.com/vishala5000/shorts-Video-Generator/releases/download/videos/{}.mp4"
        
        echo ""
        echo "🔍 Verifying downloads..."
        
        FILE_COUNT=$(ls -1 app/src/main/assets/*.mp4 2>/dev/null | wc -l)
        echo "Found $FILE_COUNT .mp4 files"
        
        EMPTY_COUNT=$(find app/src/main/assets -name "*.mp4" -empty | wc -l)
        echo "Found $EMPTY_COUNT empty .mp4 files"
        
        if [ ! -f "app/src/main/assets/font.ttf" ]; then
          echo "❌ ERROR: font.ttf is missing!"
          exit 1
        fi
        
        FONT_SIZE=$(stat -c%s "app/src/main/assets/font.ttf")
        if [ "$FONT_SIZE" -lt 1000 ]; then
          echo "❌ ERROR: font.ttf is too small ($FONT_SIZE bytes)!"
          exit 1
        fi
        
        if [ "$FILE_COUNT" -ne 200 ]; then
          echo "❌ ERROR: Expected 200 mp4 files, but found $FILE_COUNT"
          exit 1
        fi
        
        if [ "$EMPTY_COUNT" -ne 0 ]; then
          echo "❌ ERROR: Found $EMPTY_COUNT empty video files!"
          exit 1
        fi
        
        echo ""
        echo "✅ SUCCESS: All assets downloaded correctly!"
        echo "📊 Total assets size:"
        du -sh app/src/main/assets/

    - name: Build Signed Release APK
      run: |
        ./gradlew assembleRelease --no-daemon \
          -Pandroid.injected.signing.store.file=$(pwd)/release-key.jks \
          -Pandroid.injected.signing.store.password=android123 \
          -Pandroid.injected.signing.key.alias=release-key \
          -Pandroid.injected.signing.key.password=android123

    - name: Verify and Upload Signed APK
      run: |
        echo "📦 Finding signed APK file..."
        APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
        
        if [ -z "$APK_FILE" ]; then
          echo "❌ ERROR: No APK file found"
          ls -la app/build/outputs/apk/release/ || echo "Directory doesn't exist"
          exit 1
        fi
        
        echo "✅ Found APK: $APK_FILE"
        APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
        echo "📊 APK size: $APK_SIZE"
        
        if echo "$APK_FILE" | grep -q "unsigned"; then
          echo "❌ ERROR: APK is unsigned!"
          exit 1
        fi
        
        echo "✅ APK is signed and ready for installation"
        cp "$APK_FILE" app/build/outputs/apk/release/ShortsVideoGenerator.apk

    - name: Upload Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Shorts-Video-Generator-Signed-APK
        path: app/build/outputs/apk/release/ShortsVideoGenerator.apk
        retention-days: 7
