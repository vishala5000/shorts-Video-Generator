name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Download 200 Videos + Font into APK Assets
      run: |
        echo "📁 Creating assets directory..."
        mkdir -p app/src/main/assets
        
        echo "📥 Downloading font.ttf..."
        curl -fL --retry 3 -o app/src/main/assets/font.ttf "https://github.com/vishala5000/shorts-Video-Generator/releases/download/videos/font.ttf"
        
        echo "📥 Downloading 200 video clips in parallel (20 at a time)..."
        seq 1 200 | xargs -P 20 -I {} curl -fL --retry 3 -o "app/src/main/assets/{}.mp4" "https://github.com/vishala5000/shorts-Video-Generator/releases/download/videos/{}.mp4"
        
        echo ""
        echo "🔍 Verifying downloads..."
        
        FILE_COUNT=$(ls -1 app/src/main/assets/*.mp4 2>/dev/null | wc -l)
        echo "Found $FILE_COUNT .mp4 files"
        
        EMPTY_COUNT=$(find app/src/main/assets -name "*.mp4" -empty | wc -l)
        echo "Found $EMPTY_COUNT empty .mp4 files"
        
        if [ ! -f "app/src/main/assets/font.ttf" ]; then
          echo "❌ ERROR: font.ttf is missing!"
          exit 1
        fi
        
        FONT_SIZE=$(stat -c%s "app/src/main/assets/font.ttf")
        if [ "$FONT_SIZE" -lt 1000 ]; then
          echo "❌ ERROR: font.ttf is too small ($FONT_SIZE bytes)!"
          exit 1
        fi
        
        if [ "$FILE_COUNT" -ne 200 ]; then
          echo "❌ ERROR: Expected 200 mp4 files, but found $FILE_COUNT"
          exit 1
        fi
        
        if [ "$EMPTY_COUNT" -ne 0 ]; then
          echo "❌ ERROR: Found $EMPTY_COUNT empty video files!"
          exit 1
        fi
        
        echo ""
        echo "✅ SUCCESS: All assets downloaded correctly!"
        echo "📊 Total assets size:"
        du -sh app/src/main/assets/

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon

    - name: Verify APK Size
      run: |
        echo "📦 Checking APK size..."
        APK_PATH="app/build/outputs/apk/release/app-release.apk"
        if [ ! -f "$APK_PATH" ]; then
          echo "❌ ERROR: APK not found at $APK_PATH"
          exit 1
        fi
        APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
        echo "✅ APK built successfully: $APK_SIZE"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Shorts-Video-Generator-APK
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 7
