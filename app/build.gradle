plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.shortsvideogenerator'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.shortsvideogenerator"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // CRITICAL: Prevent Android from compressing mp4 files in the APK
    aaptOptions {
        noCompress 'mp4'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full:6.0.3'
    implementation 'com.arthenica:smart-exception-java:0.2.1'
}
